<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .card{width:1200px;height:630px;position:relative;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(170deg,#1b2740 0%,#2d3c5c 42%,#6b5740 78%,#a9713a 100%);color:#fff}
  .sun{position:absolute;right:132px;top:84px;width:86px;height:86px;border-radius:50%;
    background:radial-gradient(circle,#fff6d8 0%,#ffd37a 45%,#f0a23c 100%);
    box-shadow:0 0 70px 30px rgba(255,190,90,.45)}
  .arc{position:absolute;right:44px;top:52px}
  .city{position:absolute;left:0;right:0;bottom:0;height:360px}
  .txt{position:absolute;left:64px;top:74px;width:640px}
  .eyebrow{font-size:19px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#ffd37a;margin-bottom:16px}
  h1{font-size:62px;line-height:1.04;margin:0 0 18px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  p{font-size:25px;line-height:1.36;margin:0;color:#e4e9f2;max-width:19em}
  .chips{position:absolute;left:64px;bottom:56px;display:flex;gap:10px;align-items:center}
  .chip{font-size:17px;font-weight:600;padding:9px 15px;border-radius:999px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(3px)}
  .chip.hero{background:#ecfeff;border-color:#a5f3fc;color:#155e75}
  .url{position:absolute;right:52px;bottom:56px;font-size:21px;font-weight:700;color:#fff;opacity:.92}
</style></head><body>
<div class="card">
  <svg class="arc" width="470" height="250" viewBox="0 0 470 250" fill="none">
    <path d="M16 236 C 110 30, 360 30, 454 236" stroke="#ffc94a" stroke-width="4" stroke-linecap="round" opacity=".92"/>
    <circle cx="16" cy="236" r="7" fill="#f6ad55"/><circle cx="454" cy="236" r="7" fill="#e8734a"/>
  </svg>
  <div class="sun"></div>
  <svg class="city" viewBox="0 0 1200 360" preserveAspectRatio="none">
    <defs><linearGradient id="gfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e5f47"/><stop offset="1" stop-color="#222a20"/>
    </linearGradient></defs>
    <rect x="0" y="150" width="1200" height="210" fill="url(#gfade)"/>
    <!-- shadows thrown left across the ground: the sun is up on the right -->
    <g fill="#18200f" opacity=".45">
      <polygon points="740,150 860,150 610,290 470,290"/>
      <polygon points="900,150 1000,150 700,262 590,262"/>
      <polygon points="1020,150 1100,150 838,232 748,232"/>
      <polygon points="1120,150 1190,150 980,206 900,206"/>
    </g>
    <!-- buildings: the examined house is tinted cyan, as the app does -->
    <g>
      <rect x="900" y="24" width="100" height="126" fill="#c3cbd6"/><rect x="900" y="24" width="32" height="126" fill="#e6ebf1"/>
      <rect x="1020" y="58" width="80" height="92" fill="#cfd6df"/><rect x="1020" y="58" width="26" height="92" fill="#eef2f7"/>
      <rect x="1120" y="86" width="70" height="64" fill="#c8d0da"/><rect x="1120" y="86" width="22" height="64" fill="#e6ebf1"/>
      <rect x="740" y="68" width="120" height="82" fill="#a5f3fc"/><rect x="740" y="68" width="34" height="82" fill="#d6fbff"/>
      <polygon points="732,68 800,28 868,68" fill="#7fe3f0"/>
    </g>
  </svg>
  <div class="txt">
    <div class="eyebrow">Suncast 3D</div>
    <h1>Sun and shadows<br>for any address</h1>
    <p>See where the light falls, on any date and at any hour — in 3D, free.</p>
  </div>
  <div class="chips">
    <div class="chip hero">☀ 10 h 00 of direct sun</div>
    <div class="chip">Neighbours' shadows included</div>
  </div>
  <div class="url">suncast.web.app</div>
</div>
</body></html>
