name: Deploy to Firebase Hosting on merge

# Runs whenever main gets new commits (a direct push or a merged PR).
# Deploys ONLY the static viewer (public/) to Firebase Hosting. The /api
# Cloud Run service is deployed separately (gcloud run deploy) — see
# docs/DEPLOY.md.
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # public/config.local.js is git-ignored (it holds API keys) and so is
      # never in the checkout. Recreate it here from repo secrets.
      - name: Write public/config.local.js from repo secrets
        run: |
          cat > public/config.local.js <<'CFG'
          // Generated by CI (.github/workflows/firebase-hosting-merge.yml) — not committed.
          window.CONFIG = {
            cesiumIonToken: "${{ secrets.CESIUM_ION_TOKEN }}",
            googleMapsKey:  "${{ secrets.GOOGLE_MAPS_KEY }}",
          };
          CFG

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUNCAST_3D }}'
          projectId: suncast-3d
          channelId: live
